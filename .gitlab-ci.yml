variables:
  DOCKER_REPOSITORY: mendersoftware/reporting
  # Setup containers to use docker dind service
  DOCKER_HOST: "tcp://docker:2376"
  DOCKER_CERT_PATH: "/certs/client"
  DOCKER_TLS_VERIFY: 1

  DOCKER_TLS_CERTDIR: "/certs" # Where docker:dind should generate certs

stages:
  - test
  - build
  - publish

include:
  - project: 'Northern.tech/Mender/mendertesting'
    file: '.gitlab-ci-check-golang-lint.yml'
  - project: 'Northern.tech/Mender/mendertesting'
    file: '.gitlab-ci-check-golang-unittests.yml'
  - project: 'Northern.tech/Mender/mendertesting'
    file: '.gitlab-ci-check-apidocs.yml'
  - project: 'Northern.tech/Mender/mendertesting'
    file: '.gitlab-ci-check-commits.yml'
  - project: 'Northern.tech/Mender/mendertesting'
    file: '.gitlab-ci-check-license.yml'
  - project: 'Northern.tech/Mender/mendertesting'
    file: '.gitlab-ci-github-status-updates.yml'
  - project: 'Northern.tech/Mender/mendertesting'
    file: '.gitlab-ci-check-docker-build.yml'

test:acceptance:
  stage: test
  needs: []
  except:
    - /^saas-[a-zA-Z0-9.-]+$/
  tags:
    - hetzner-amd-beefy
  image: docker:20.10.21
  services:
    - name: docker:20.10.21-dind
      alias: docker
      command: ["--mtu=1440"]
  before_script:
    - apk add docker-compose make
  script:
    - make acceptance-tests
  artifacts:
    expire_in: 2w
    paths:
      - tests/acceptance.*
      - tests/coverage*.txt
    when: always

publish:acceptance:
  stage: publish
  except:
    - /^saas-[a-zA-Z0-9.-]+$/
  image: curlimages/curl-base
  needs:
    - job: test:acceptance
      artifacts: true
  script:
    - curl -Os https://cli.codecov.io/latest/alpine/codecov
    - chmod +x codecov
    - ./codecov upload-process
      --fail-on-error
      --git-service github
      --slug mendersoftware/${CI_PROJECT_NAME}
      --sha ${CI_COMMIT_SHA}
      --pr $(echo "${CI_COMMIT_BRANCH}" | sed 's/^pr_//')
      --file ./tests/coverage-acceptance.txt
      --flag acceptance
